<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .table-wrap {
      overflow-x: auto;
      background: var(--white);
      border: 1px solid var(--line);
    }
    #ordersTable {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
      font-size: 0.92rem;
      line-height: 1.7;
    }
    #ordersTable th,
    #ordersTable td {
      padding: 1rem 1.1rem;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line);
    }
    #ordersTable thead th {
      font-family: var(--font-heading-th);
      font-weight: 400;
      color: var(--ink);
      background: var(--cream);
      border-bottom: 1px solid var(--line-strong);
      white-space: nowrap;
    }
    #ordersTable tbody td { color: var(--ink-soft); }
    #ordersTable tbody tr:last-child td { border-bottom: 0; }
    #ordersTable td:nth-child(1) { white-space: nowrap; }
    #ordersTable td:nth-child(5) { white-space: nowrap; color: var(--gold-deep); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">BODY SCENT</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section--cream" style="padding-bottom: var(--space-5);">
      <div class="container text-center">
        <h1 style="font-size: clamp(2rem, 4.5vw, 3rem);">รายการสั่งซื้อ</h1>
        <div class="divider" aria-hidden="true"><i></i></div>
        <p class="lead">รายการล่าสุดแสดงก่อน</p>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Body Scent. สงวนลิขสิทธิ์</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
