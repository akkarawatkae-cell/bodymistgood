<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .order-wrap { max-width: 560px; margin-inline: auto; }
    .order-wrap textarea { resize: vertical; min-height: 3.2rem; }
    .order-actions { margin-top: var(--space-4); text-align: center; }
    .order-actions .btn { min-width: 240px; }
    .back-link {
      display: inline-block;
      margin-top: var(--space-3);
      font-size: 0.9rem;
      color: var(--ink-soft);
      border-bottom: 1px solid var(--line);
    }
    .total-field { display: flex; align-items: baseline; gap: var(--space-1); }
    .total-field span { font-size: 0.9rem; color: var(--ink-soft); white-space: nowrap; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">BODY SCENT</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section--cream" style="padding-bottom: var(--space-5);">
      <div class="container text-center">
        <h1 style="font-size: clamp(2rem, 4.5vw, 3rem);">สั่งซื้อสินค้า</h1>
        <div class="divider" aria-hidden="true"><i></i></div>
        <p class="lead">กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>
      </div>
    </section>

    <section>
      <div class="container">
        <form id="orderForm" class="order-wrap" autocomplete="on">

          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <textarea id="items" name="items" rows="2" required></textarea>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม</label>
            <div class="total-field">
              <input type="text" id="total" name="total" inputmode="numeric" required>
              <span>บาท</span>
            </div>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ <small>(ไม่บังคับ)</small></label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <div class="order-actions">
            <button type="submit" class="btn btn--solid">ยืนยันสั่งซื้อ</button>
            <br>
            <a class="back-link" href="product.html">กลับไปเลือกสินค้า</a>
          </div>

        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Body Scent. สงวนลิขสิทธิ์</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
