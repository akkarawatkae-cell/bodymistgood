<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ขอบคุณที่สั่งซื้อ — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .thanks {
      min-height: calc(100svh - 5.5rem);
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, var(--cream) 0%, var(--ivory) 100%);
    }
    .thanks .container { max-width: 640px; }
    .thanks h1 { font-size: clamp(2rem, 4.5vw, 3rem); }
    .thanks .lead { margin-inline: auto; }
    .thanks .btn { margin-top: var(--space-3); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">BODY SCENT</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="thanks text-center">
      <div class="container">
        <h1>ขอบคุณที่สั่งซื้อ</h1>
        <div class="divider" aria-hidden="true"><i></i></div>
        <p class="lead">เราได้รับคำสั่งซื้อของคุณแล้ว และจะติดต่อกลับตามช่องทางที่ให้ไว้เร็วๆ นี้</p>
        <a class="btn" href="index.html">กลับหน้าแรก</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Body Scent. สงวนลิขสิทธิ์</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
